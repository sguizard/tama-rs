[workspace]
resolver = "2"
members = ["crates/tama-core", "crates/tama-io", "crates/tama"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sguizard/tama-rs"
description = "TAMA: Transcriptome Annotation by Modular Algorithms (Rust rewrite)"
keywords = ["bioinformatics", "transcriptome", "long-read", "isoseq", "genomics"]
categories = ["command-line-utilities", "science"]

[workspace.dependencies]
tama-core = { path = "crates/tama-core", version = "0.3.0" }
tama-io = { path = "crates/tama-io", version = "0.3.0" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
log = "0.4"
env_logger = "0.11"
indexmap = "2"
rayon = "1"
flate2 = "1"
# noodles-* added to tama-io via `cargo add` so versions resolve to valid releases

[profile.release]
lto = "thin"
codegen-units = 1
