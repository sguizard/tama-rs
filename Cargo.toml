[workspace]
resolver = "2"
members = ["crates/tama-core", "crates/tama-io", "crates/tama"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/GenomeRIK/tama"
description = "TAMA: Transcriptome Annotation by Modular Algorithms (Rust rewrite)"

[workspace.dependencies]
tama-core = { path = "crates/tama-core" }
tama-io = { path = "crates/tama-io" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
indexmap = "2"
rayon = "1"
flate2 = "1"
# noodles-* added to tama-io via `cargo add` so versions resolve to valid releases

[profile.release]
lto = "thin"
codegen-units = 1
