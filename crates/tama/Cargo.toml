[package]
# Published as `tama-rs`: the `tama` name on crates.io is taken by an
# unrelated project. The installed binary is still called `tama`.
name = "tama-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Keep the library crate importable as `tama` (integration tests use it).
[lib]
name = "tama"
path = "src/lib.rs"

[[bin]]
name = "tama"
path = "src/main.rs"

[dependencies]
tama-core.workspace = true
tama-io.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
log.workspace = true
env_logger.workspace = true
indexmap.workspace = true
rayon.workspace = true
